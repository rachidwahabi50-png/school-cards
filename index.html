<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بطاقة التلميذ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f1f5f9;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:90%;
    max-width:400px;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:20px;
}

.photo{
    width:120px;
    height:120px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 20px;
    background:#e2e8f0;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    margin:10px 0 20px;
    font-size:25px;
}

.info{
    text-align:right;
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
    line-height:2.2;
}

.label{
    font-weight:bold;
}

.error{
    color:red;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">ÉCOLE ABC</div>

    <div class="photo">
        <img id="photo" src="" alt="Photo">
    </div>

    <h1 id="name">Chargement...</h1>

    <div class="info">

        <div>
            <span class="label">رقم التسجيل:</span>
            <span id="id"></span>
        </div>

        <div>
            <span class="label">القسم:</span>
            <span id="class"></span>
        </div>

    </div>

</div>

<script>

const students = {

    "001": {
        nom: "العلوي",
        prenom: "محمد",
        classe: "3A",
        photo: "https://i.pravatar.cc/300?img=12"
    },

    "002": {
        nom: "البناني",
        prenom: "ياسين",
        classe: "3B",
        photo: "https://i.pravatar.cc/300?img=13"
    },

    "003": {
        nom: "أمثال",
        prenom: "أحمد",
        classe: "4A",
        photo: "https://i.pravatar.cc/300?img=14"
    }

};

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

const student = students[id];

if(student){

    document.getElementById("name").textContent =
        student.prenom + " " + student.nom;

    document.getElementById("id").textContent =
        id;

    document.getElementById("class").textContent =
        student.classe;

    document.getElementById("photo").src =
        student.photo;

}else{

    document.getElementById("name").textContent =
        "التلميذ غير موجود";

    document.getElementById("name").className =
        "error";

}

</script>

</body>
</html>
