<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقة التلميذ</title>

<style>
body{
    margin:0;
    background:#f1f5f9;
    font-family:Arial,sans-serif;
}

.card{
    width:90%;
    max-width:400px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:20px;
}

.photo{
    width:110px;
    height:110px;
    border-radius:50%;
    background:#e2e8f0;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

h1{
    margin:10px 0;
}

.info{
    text-align:right;
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
    line-height:2;
}

.label{
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">ÉCOLE ABC</div>

<div class="photo">
<img id="photo" src="" alt="Photo de l'élève">
</div>

<h1 id="name">Chargement...</h1>

<div class="info">
<div>
<span class="label">رقم التسجيل:</span>
<span id="id"></span>
</div>

<div>
<span class="label">القسم:</span>
<span id="class"></span>
</div>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("students.json")
.then(response => response.json())
.then(students => {

    const student = students.find(s => s.id === id);

    if(student){

        document.getElementById("name").textContent =
        student.prenom + " " + student.nom;

        document.getElementById("id").textContent =
        student.id;

        document.getElementById("class").textContent =
        student.classe;

    }else{

        document.getElementById("name").textContent =
        "التلميذ غير موجود";

    }

})
.catch(error => {

    document.getElementById("name").textContent =
    "وقع خطأ في تحميل المعلومات";

});

</script>

</body>
</html>
