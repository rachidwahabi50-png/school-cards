<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة التلميذ</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
}

.card {
  max-width: 400px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 4px 20px #0002;
}

h1 {
  margin-bottom: 25px;
}

.info {
  text-align: right;
  line-height: 2;
}
</style>
</head>

<body>

<div class="card">

<h1>معلومات التلميذ</h1>

<div class="info">
<p><b>الاسم:</b> محمد</p>
<p><b>النسب:</b> العلوي</p>
<p><b>رقم التسجيل:</b> 001</p>
<p><b>القسم:</b> 3A</p>
</div>

</div>

</body>
</html>
